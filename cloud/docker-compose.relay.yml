# Docker Compose for the Cloud Relay (self-hosted or DO deployment)
#
# Usage:
#   docker compose -f cloud/docker-compose.relay.yml up -d
#
# For self-hosted users who want to run their own relay
# instead of using the hosted streamextend.com/creatorextend.com relay.

services:
  relay-api:
    build:
      context: ./relay-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?configure the non-superuser relay_app connection}
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_JWT_SECRET: ${RELAY_JWT_SECRET:-change-me-in-production}
      RELAY_ENVIRONMENT: ${RELAY_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: relay
      RELAY_DATABASE_PASSWORD: ${RELAY_DATABASE_PASSWORD:?set the relay_app runtime password}
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/002_runtime_role.sql:/docker-entrypoint-initdb.d/002_runtime_role.sql:ro
      - ./migrations/003_runtime_password.sh:/docker-entrypoint-initdb.d/003_runtime_password.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - relay_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  relay_pgdata:
  relay_redis:
