[package]
name = "setup-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Versioned capability readiness and OpenTechnology synchronization"

[dependencies]
local-settings = { path = "../local-settings" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
