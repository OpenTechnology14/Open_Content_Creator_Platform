[package]
name = "tauri-plugin-module-setup"
links = "tauri-plugin-module-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared native module selection, dependency installation and readiness evidence"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "fs", "sync", "rt", "net", "io-util"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
local-settings = { path = "../local-settings" }

[build-dependencies]
serde_json = "1"
tauri-plugin = { version = "2", features = ["build"] }
