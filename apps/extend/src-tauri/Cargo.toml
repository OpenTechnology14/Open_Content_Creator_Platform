[package]
name = "extend-preview"
version = "0.1.0"
description = "Private combined workspace preview"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "extend_preview_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart"] }
url = "2"
obws = "0.15"
time = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

# Workspace crates
relay-client = { path = "../../shared/relay-client" }
command-error = { path = "../../shared/command-error" }
setup-wizard = { package = "tauri-plugin-module-setup", path = "../../shared/setup-wizard" }
local-settings = { path = "../../shared/local-settings" }
setup-engine = { path = "../../shared/setup-engine" }
social-manager = { package = "tauri-plugin-social-manager", path = "../../shared/social-manager" }
recording-library = { path = "../../shared/recording-library" }

[dev-dependencies]
wiremock = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
