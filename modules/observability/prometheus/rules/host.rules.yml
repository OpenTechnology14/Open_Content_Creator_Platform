groups:
  - name: host
    interval: 30s
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU >90% for 10m on {{ $labels.instance }}"

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory >90% for 10m on {{ $labels.instance }}"

      - alert: HostDiskFillingFast
        expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Filesystem will fill within 24h on {{ $labels.instance }}:{{ $labels.mountpoint }}"

  - name: gpu
    interval: 30s
    rules:
      - alert: GPUOverheating
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} >85C for 5m"

      - alert: GPUUtilizationStuckHigh
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[30m]) > 95
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "GPU {{ $labels.gpu }} pinned >95% for 30m — confirm workload is expected"
