# Alertmanager configuration
#
# Update the receivers section with your actual webhook URLs / email.
# See modules/observability/setup/manual.md for setup instructions.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'default'
      repeat_interval: 4h

inhibit_rules:
  # Don't alert on service-down if the host is down
  - source_match:
      alertname: HostDown
    target_match_re:
      alertname: '.+'
    equal: ['instance']

receivers:
  - name: 'default'
    # Uncomment and fill in your notification channel:
    # webhook_configs:
    #   - url: 'https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN'
    #     send_resolved: true

  - name: 'critical'
    # For critical alerts — consider a separate, louder channel:
    # webhook_configs:
    #   - url: 'https://discord.com/api/webhooks/YOUR_CRITICAL_WEBHOOK'
    #     send_resolved: true
    # email_configs:
    #   - to: 'your-email@example.com'
    #     from: 'alertmanager@hcp.local'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: ''
    #     auth_password: ''
