# Prometheus config for Open Content Creator Platform.
# Scrapes the FastAPI app (which exposes /metrics via the instrumentator) plus
# any exporters you decide to add. Keep this list short — anything noisy goes in
# rules/*.yml as a recording rule first.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hcp
    env: ${HCP_ENV:-local}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Fill in once Alertmanager is enabled — see modules/observability/prometheus/README.md.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ['fastapi:8000']

  - job_name: source-health
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['source-health-exporter:9101']

  # Optional exporters — uncomment when you add them.
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  # - job_name: node
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  # - job_name: dcgm     # NVIDIA GPU metrics
  #   static_configs:
  #     - targets: ['dcgm-exporter:9400']
  # - job_name: minio
  #   metrics_path: /minio/v2/metrics/cluster
  #   static_configs:
  #     - targets: ['minio:9000']
