# PipeWire config snippet for HCP audio buses.
# Drop into /etc/pipewire/pipewire.conf.d/hcp-buses.conf and restart pipewire:
#   systemctl --user restart pipewire pipewire-pulse
#
# This creates virtual null-sinks that map to the bus names used in
# routing/README.md. Route apps to these sinks via pavucontrol or
# `wpctl set-default <id>`.

context.modules = [
  {   name = libpipewire-module-loopback
      args = {
          node.description = "HCP-MIC"
          capture.props    = { node.name = "hcp-mic-cap"   media.class = "Audio/Sink" }
          playback.props   = { node.name = "hcp-mic-out"   media.class = "Audio/Source" }
      }
  }
  {   name = libpipewire-module-loopback
      args = {
          node.description = "HCP-GAME"
          capture.props    = { node.name = "hcp-game-cap"  media.class = "Audio/Sink" }
          playback.props   = { node.name = "hcp-game-out"  media.class = "Audio/Source" }
      }
  }
  {   name = libpipewire-module-loopback
      args = {
          node.description = "HCP-MUSIC"
          capture.props    = { node.name = "hcp-music-cap" media.class = "Audio/Sink" }
          playback.props   = { node.name = "hcp-music-out" media.class = "Audio/Source" }
      }
  }
  {   name = libpipewire-module-loopback
      args = {
          node.description = "HCP-AI-VOICE"
          capture.props    = { node.name = "hcp-ai-cap"    media.class = "Audio/Sink" }
          playback.props   = { node.name = "hcp-ai-out"    media.class = "Audio/Source" }
      }
  }
  {   name = libpipewire-module-loopback
      args = {
          node.description = "HCP-CALL-IN"
          capture.props    = { node.name = "hcp-call-cap"  media.class = "Audio/Sink" }
          playback.props   = { node.name = "hcp-call-out"  media.class = "Audio/Source" }
      }
  }
  {   name = libpipewire-module-loopback
      args = {
          # routing/README.md's canonical bus table names 6 buses; this file
          # previously created only 5, silently missing MONITOR despite its
          # own header comment claiming to map every bus name (found 2026-09-01,
          # P-038). Unlike VoiceMeeter on Windows — which routes monitoring
          # through a physical A-output with no dedicated virtual bus needed —
          # PipeWire's virtual-sink model needs an explicit one for headphone
          # monitoring to work the way the canonical table describes.
          node.description = "HCP-MONITOR"
          capture.props    = { node.name = "hcp-monitor-cap" media.class = "Audio/Sink" }
          playback.props   = { node.name = "hcp-monitor-out" media.class = "Audio/Source" }
      }
  }
]
