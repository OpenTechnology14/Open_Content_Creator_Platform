# Starter-pack registry for modules/soundboard.
#
# Two statuses:
#   bundled     — a real audio file ships in this repo, under sounds/<file>.
#   placeholder — the slot exists (name, category, obs-soundboard is ready to
#                 have a file dropped in) but no audio ships here. Either the
#                 obvious clip is copyrighted (most iconic meme sounds — see
#                 each entry's `note`) or no suitable CC0 clip was found.
#
# Every `bundled` entry's `source`/`source_url`/`license` names exactly where
# the file came from — required before anything gets bundled into this repo,
# same rule this platform already applies to model weights (model-registry)
# and image corpora (IMAGE_INTAKE.md).

sounds:
  # ── Bundled — Kenney.nl, CC0 1.0, verified 2026-09-01 ─────────────────
  - name: Record Scratch
    slot: record-scratch
    category: stinger
    status: bundled
    file: stingers/record-scratch.ogg
    source: "Kenney.nl — Interface Sounds"
    source_url: https://kenney.nl/assets/interface-sounds
    license: CC0 1.0

