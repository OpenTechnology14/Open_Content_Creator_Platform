<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; padding: 12px; }
  label { display: block; margin: 8px 0 2px; font-size: 12px; opacity: 0.7; }
  input, button { width: 100%; padding: 6px 8px; box-sizing: border-box; }
  button { margin-top: 10px; cursor: pointer; }
</style>
</head>
<body>
  <label>Title</label><input id="title" />
  <label>Subtitle</label><input id="subtitle" />
  <button id="show">Show</button>
  <button id="hide">Hide</button>
  <script>
    const rep = nodecg.Replicant('lowerThird');
    const t = document.getElementById('title');
    const s = document.getElementById('subtitle');
    rep.on('change', v => { if (!v) return; t.value = v.title || ''; s.value = v.subtitle || ''; });
    document.getElementById('show').onclick = () => { rep.value = { visible: true,  title: t.value, subtitle: s.value }; };
    document.getElementById('hide').onclick = () => { rep.value = { visible: false, title: t.value, subtitle: s.value }; };
  </script>
</body>
</html>
