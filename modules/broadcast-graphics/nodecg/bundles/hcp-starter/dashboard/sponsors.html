<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; padding: 12px; }
  textarea { width: 100%; min-height: 140px; font-family: ui-monospace, monospace; box-sizing: border-box; }
  button { padding: 6px 12px; cursor: pointer; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
</style>
</head>
<body>
  <p>Paste a JSON array of sponsors:</p>
  <textarea id="rotation">[
  {"name": "Example Co", "tag": "Built for streamers", "logo": "/sample.png"}
]</textarea>
  <div class="row">
    <button id="save">Save rotation</button>
    <button id="show">Show next</button>
    <button id="clear">Clear</button>
  </div>
  <script>
    const rep = nodecg.Replicant('sponsor');
    let idx = 0;
    document.getElementById('save').onclick = () => {
      try {
        const rotation = JSON.parse(document.getElementById('rotation').value);
        rep.value = { active: null, rotation };
        idx = 0;
      } catch (e) { alert('invalid JSON: ' + e.message); }
    };
    document.getElementById('show').onclick = () => {
      const r = rep.value?.rotation ?? [];
      if (!r.length) return;
      rep.value = { active: r[idx % r.length], rotation: r };
      idx += 1;
    };
    document.getElementById('clear').onclick = () => {
      rep.value = { active: null, rotation: rep.value?.rotation ?? [] };
    };
  </script>
</body>
</html>
