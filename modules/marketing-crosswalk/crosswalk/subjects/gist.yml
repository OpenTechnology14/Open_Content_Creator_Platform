    - "task-management — the OpenTechnologyApp project/queue app. Gist is a separate repository and a separate product."
    - "myfeed — another separate product, a feed reader. Gist's 'intake pipeline' is product-data intake for its directory, not feed or source intake."
    - "This repository's image intake (docs/IMAGE_INTAKE.md) and the nature-generation and cityscape-generation modules take photographs for a generation corpus. Gist's intake is barcode, scrape and label-OCR intake of products."
    - "PROP-001 and PROP-002, with their INTAKE-D, SCHEMA-D and SPEED-D gates, are proposals in Gist's own queue (docs/proposals/PROPOSAL_WORK_QUEUE.md there), not features and not this repository's P-NNN proposals."
