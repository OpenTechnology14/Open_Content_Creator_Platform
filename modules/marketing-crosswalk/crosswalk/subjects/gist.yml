promotion:
  blocked_on: "Owner decision to market Gist, with owner-approved copy and ICPs"
  steps:
    - "Decide whether Gist is marketed at all and to whom; define its ICPs in this file (the placeholder above is not an audience)"
    - "Add a products.yml entry with owner-approved tagline, one-liner, pricing and competitors, then set `product:` here"
    - "Declare the target's marketing docs and anchors in targets.yml; keep `optional` until a checkout is expected on every machine"
