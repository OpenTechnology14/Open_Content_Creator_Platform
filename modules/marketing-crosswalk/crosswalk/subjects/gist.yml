discovery:
  status: drafted
  last_verified: 2026-10-24
  notes: >-
    A mobile-first grocery list and food health-scoring web app (React 18 and Vite 5, with Vercel
    API routes and Supabase or Turso schemas) in its own repository. It scores products from Open
    Food Facts (Nutri-Score, NOVA group, additive risk, a 0-100 Gist Score), scans barcodes and
    keeps a product directory. API intake is built; scraping, AI-assisted scraping, manual scan or
    label-OCR intake, a cosmetic product type and the directory speed work are PROPOSED in its own
    queue (PROP-001, PROP-002), not features. Route a request here when it is about Gist, its
    directory or its intake pipeline.
  discovery_keywords:
    ["Gist", "Gist app", "gist-app", "Gist Score", "product directory", "directory build",
     "product intake", "intake pipeline", "grocery", "grocery list", "grocery app", "food health",
     "cosmetics", "cosmetic products", "barcode scan", "barcode scanner", "label OCR", "OCR",
     "Nutri-Score", "NOVA group", "additive risk", "Open Food Facts", "PROP-001", "PROP-002"]
  not_to_be_confused_with:
