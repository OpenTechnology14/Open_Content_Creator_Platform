# Content Platform module registry — THE CANONICAL DISCOVERY INDEX.
#
# If you are an agent or a person in ANY of the three repositories (hybrid-creator-platform,
# OpenTechnologyApp, OpenTechnologyBlog) trying to answer "what marketing
# modules exist?", this file is the answer. Read it first, before grepping either other repo.
#
# The Content Platform (this repository) generates content FOR each module listed here.
# A module is a content *consumer*; each has a subjects file naming what the content is about.
#
# ── How to find a module ────────────────────────────────────────────────────────────────
#   rg -i "<term>" modules/marketing-crosswalk/crosswalk/modules.yml
# Match against `discovery_keywords` (search terms) and `notes` (plain-language description).
# `not_to_be_confused_with` exists because several modules share the word "AI" and have been
# misrouted in practice — check it before acting on a name match.
#
# ── Field reference ─────────────────────────────────────────────────────────────────────
# See crosswalk/schema.md. Required by the loader: module, kind, target, subjects.
# Everything else is discovery metadata: the loader ignores unknown keys, so enriching a row
# can never break `validate`.
#
# ── Counts are transcribed, not computed ────────────────────────────────────────────────
# `counts` is a hand-maintained snapshot with a `basis` line saying what was counted and from
# where. Nothing recomputes it, so it is true as of `last_verified` and not a live figure.
# When it disagrees with the repo, the repo wins — fix the count, do not trust it.
#
# ── Playbooks ───────────────────────────────────────────────────────────────────────────
# Each target's go-to-market playbook is a registered doc (targets.yml `marketing_playbook`):
# OpenTechnologyApp's MARKETING.md for `task-management`, and this repository's MARKETING.md for
# `stream-extend` and `content-extend` (their `files.marketing_doc`).
#
# The sibling modules under `modules/` are NOT listed as rows (most appear instead as subjects of
# `stream-extend` / `content-extend`). `validate` does not require a row per modules/ directory;
# onboarding one is an explicit act, not a coverage obligation.
schema_version: 1

modules:
  - module: task-management
    kind: external-app
    target: task-management          # key in targets.yml — where content is delivered
    subjects: subjects/task-management.yml
    description: >-
      OpenTechnology — the task/queue management app. Content generated for it is about
      its six built-in project templates, aimed at the five ICPs in MARKETING.md §2 and
      shaped by the five-format content engine in §4.
    onboarded: 2026-08-30
    status: partially-shipped
    last_verified: 2026-09-23
    notes: >-
      The flagship product module. Content is about six project templates the app ships
      (pm_requests, device_audit, job_hunter, extend_platform, access_compliance,
      site_monitoring) — not about AI, and not about streaming. If a request mentions a
      project template, a client portal, queues, or a Jira/Monday/Salesforce comparison,
      this is the module.
    discovery_keywords:
      - task management
      - OpenTechnology
      - OpenTechnologyApp
      - project templates
      - pm requests
      - device audit
      - job hunter
      - access compliance
      - site monitoring
      - client portal
      - Jira alternative
      - Monday alternative
      - Salesforce alternative
    not_to_be_confused_with:
      - "extend-platform is a TEMPLATE inside this module, not the stream-extend/content-extend product modules"
    counts:
      basis: "subjects counted from subjects/task-management.yml; assets from assets.yml; ICPs from this module's icps block"
      subjects: 6
      marketing_assets_available: 13
      icps: 5
    files:
      subjects_config: modules/marketing-crosswalk/crosswalk/subjects/task-management.yml
      target_repo: OpenTechnology14/OpenTechnologyApp
      marketing_doc: MARKETING.md
      crosswalk_doc: docs/readable/TEMPLATE_REPO_CROSSWALK.md
      connection_doc: docs/readable/BLOG_MARKETING_CONNECTION.md

