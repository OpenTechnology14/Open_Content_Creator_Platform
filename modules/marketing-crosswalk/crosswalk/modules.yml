  - module: myfeed
    kind: product
    target: myfeed
    subjects: subjects/myfeed.yml
    description: >-
      MyFeed — a separate single-user local media reader (feeds, connections, keyword lenses, local
      mention alerts, manual AI digests). It lives in its own repository; this repository only
      references it. Discovery-only: nothing is generated for it.
    onboarded: 2026-10-20
    status: drafted
    last_verified: 2026-10-20
    notes: >-
      A single-user, local-first media reader in its own repository. It collects RSS,
      Mastodon-compatible, Bluesky, email (IMAP), Rocket.Chat, JSON-API and YouTube sources into one
