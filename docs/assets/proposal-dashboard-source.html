<script>
(() => {
  const root=document.getElementById('platform-proposal-selector');
  const datasets=JSON.parse(document.getElementById('platform-proposal-data').textContent);
  const element=id=>root.querySelector('#'+id);
  const names={testing:'Testing',in_progress:'Build',accepted:'Accepted',pending:'Pending',deferred:'Deferred',done:'Done',standing:'Standing',local_done:'Implemented locally',conditional:'Conditional',unsupported:'Unsupported'};
  const colors={testing:'var(--viz-series-1)',in_progress:'var(--viz-series-2)',accepted:'var(--viz-series-2)',pending:'var(--viz-series-4)',deferred:'var(--viz-series-5)',done:'var(--viz-series-3)',local_done:'var(--viz-series-3)',standing:'var(--viz-series-6)',conditional:'var(--viz-series-4)',unsupported:'var(--viz-series-5)'};
  let state={project:'hybrid',section:'testing',group:'all',id:'P-056'};
  function apply(saved){
    const value=saved?.privateContent;
    if(value && Object.prototype.hasOwnProperty.call(datasets,value.project)) state={...state,...value};
    if(!datasets[state.project].sections.includes(state.section))state.section='testing';
    if(!['all','mainly_acceptance','remaining_work'].includes(state.group))state.group='all';
  }
  function save(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{project:datasets[state.project].name,workSection:names[state.section],testingOption:state.group,proposalId:state.id},privateContent:state}).catch(()=>{});
  }
  function rows(){return datasets[state.project].proposals.filter(row=>row.work_focus===state.section && (state.section!=='testing'||state.group==='all'||row.testing_group===state.group))}
  function render(){
    const data=datasets[state.project];
    element('proposal-project').value=state.project;
    element('proposal-testing-group').value=state.group;
    element('testing-group-label').hidden=state.section!=='testing';
    element('proposal-totals').textContent=data.total+' proposals · '+data.baseline;
    element('proposal-allocation').replaceChildren();
    element('proposal-sections').replaceChildren();
    const counts=Object.fromEntries(data.sections.map(section=>[section,data.proposals.filter(row=>row.work_focus===section).length]));
    element('proposal-allocation').setAttribute('aria-label',data.name+': '+data.sections.map(section=>names[section]+' '+counts[section]).join(', '));
    data.sections.forEach(section=>{
      if(counts[section]){
        const mark=document.createElement('span');mark.style.width=(100*counts[section]/data.total)+'%';mark.style.background=colors[section];mark.setAttribute('data-tooltip',names[section]+' · '+counts[section]);element('proposal-allocation').append(mark);
      }
      const button=document.createElement('button');button.className='btn';button.type='button';button.textContent=names[section]+' · '+counts[section];button.setAttribute('aria-pressed',String(section===state.section));
      button.onclick=()=>{state.section=section;state.id='';render();save()};element('proposal-sections').append(button);
    });
    const visible=rows();
    let selected=visible.find(row=>row.id===state.id)||visible[0];state.id=selected?.id||'';
    element('proposal-section-title').textContent=names[state.section]+(state.section==='testing'&&state.group!=='all'?' · '+(state.group==='mainly_acceptance'?'mainly acceptance':'remaining features'):'')+' · '+visible.length;
    element('proposal-items').replaceChildren();
    visible.forEach(row=>{
      const button=document.createElement('button');button.className='btn viz-tile';button.type='button';button.textContent=row.id;button.setAttribute('aria-label',row.id+' · '+row.title);button.setAttribute('aria-pressed',String(row.id===state.id));button.setAttribute('data-tooltip',row.title);
      button.onclick=()=>{state.id=row.id;render();save()};element('proposal-items').append(button);
    });
    element('proposal-fields').replaceChildren();element('proposal-discussion-status').textContent='';element('proposal-request-label').hidden=true;element('proposal-request-text').value='';
    element('proposal-selected-title').textContent=selected?selected.id+' · '+selected.title:'No proposals in this view';
    element('proposal-discuss').disabled=!selected;
    if(selected){
      [['Recorded status',selected.status],['Next step',selected.next],['Build / proof limits',selected.limits],['Dependencies',selected.dependencies],['Agent assignment',selected.assignment]].forEach(([label,value])=>{
        const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value||'See canonical proposal acceptance criteria';element('proposal-fields').append(dt,dd);
      });
    }
  }
  element('proposal-project').onchange=event=>{state.project=event.target.value;state.section='testing';state.group='all';state.id=state.project==='hybrid'?'P-056':'PROP-001';render();save()};
  element('proposal-testing-group').onchange=event=>{state.group=event.target.value;state.id='';render();save()};
  element('proposal-discuss').onclick=()=>{
    const row=rows().find(value=>value.id===state.id);if(!row)return;
    element('proposal-request-text').value='Review the next bounded slice for '+datasets[state.project].name+' '+row.id+' ('+row.title+'). Current next step: '+row.next+'. Check its canonical proposal, dependencies and required inputs before acting. Keep live-provider, publishing, gameplay and paid-AI permissions explicit.';
    element('proposal-request-label').hidden=false;
    element('proposal-discussion-status').textContent='Request prepared locally; select and copy the text.';
  };
  apply(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{apply(event.detail?.globals?.widgetState);render()});
})();
</script>
