shows:
- id: minecraft-town
  game_id: minecraft
  persona_id: nova-builder
  title: The Town That Chat Built
  hook: Build a persistent town from viewer proposals, one district per episode.
  interaction_prompt: Vote between the curated build options.
  clip_prompts:
  - Before-and-after reveal
  - A vote changes the plan
  segments:
  - 'Cold open: the goal and stakes'
  - Challenge with progress checkpoints
  - Result, best moment and next episode tease
  duration_minutes: 90
- id: minecraft-one-chest
  game_id: minecraft
  persona_id: nova-builder
  title: One Chest Empire
  hook: Start with one constrained inventory and grow a working settlement.
  interaction_prompt: Choose the next resource priority.
  clip_prompts:
  - Resource breakthrough
  - A plan collapses
  segments:
  - 'Cold open: the goal and stakes'
  - Challenge with progress checkpoints
  - Result, best moment and next episode tease
  duration_minutes: 90
- id: minecraft-repair
