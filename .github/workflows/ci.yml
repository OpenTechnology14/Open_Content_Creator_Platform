name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.4 pytest==8.3.2 pyyaml==6.0.2 loguru==0.7.2 minio==7.2.8 requests==2.32.3 httpx==0.27.2 redis==5.0.8 numpy==2.0.2 Pillow==10.4.0 -r configs/local/stream-test-requirements.txt
      - name: Generated documentation
        run: python scripts/testing/generate_docs.py --check
      - name: Ruff lint
        # Blocking since P-001 WP-1 (2026-09-02) — was advisory (|| true) while the 4 known
        # unused-import errors sat unfixed. They're fixed now; a new one should fail the build,
        # not join a pile nobody clears.
        run: ruff check modules/ scripts/
      - name: Write .env for compose validation
        # docker-compose.yml and its DO overlay both require these (Compose's
        # `${VAR:?}` syntax) even for `config -q`, which only renders the
        # config — it does not start anything. .env.example's placeholder
        # values are sufficient for that; this has been failing since before
        # this repo had a P-016 to notice it (docs/PROPOSALS.md P-016 detail).
        run: cp .env.example .env
      - name: Validate docker-compose
        uses: docker/setup-buildx-action@v3
      - name: compose config
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.digitalocean.yml config -q
      - name: Tests
        # No conditional: a missing or empty suite is a failure, not something to
        # excuse. `pytest` exits 5 on "no tests collected", which fails the job.
        run: pytest -q
      - name: Install acceptance-suite dependencies
        run: pip install httpx minio
      - name: Build pinned storage artifacts
        run: docker compose build minio minio-bootstrap
      - name: Acceptance harness (P-016)
        # tests/acceptance/conftest.py owns bring-up, readiness polling, and
        # teardown itself (docker_stack fixture) — that is the point of
        # `make test-acceptance` being one self-contained command. Nothing
        # else here brings the stack up first.
        run: make test-acceptance

  security-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install relay security dependencies
        run: pip install -r cloud/relay-api/requirements.txt pytest==8.3.2 pyyaml==6.0.2
      - name: Required relay security contracts
        run: python -m pytest -p scripts.testing.no_skips -m "not live" tests/cloud_relay -q
      - name: Owned Postgres tenant isolation
        run: python -m pytest -p scripts.testing.no_skips -m live tests/cloud_relay/test_tenant_isolation.py -q

  security-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend security dependencies
        run: pip install -r modules/backend-api/fastapi/requirements.txt pytest==8.3.2 pyyaml==6.0.2
      - name: Required backend security contracts
        run: python -m pytest -p scripts.testing.no_skips -m "not live" tests/backend_api -q

  build-desktop-apps:
    # Cheap, deliberately: `cargo check` not a full release bundle, and
    # ubuntu-only — the actual multi-OS installable-artifact proof is
    # WP-7's release-workflow job once D-02's OS matrix is decided (P-001
    # WP-3, P-052). This job's only claim is "does it still compile."
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [stream-extend, creator-extend, extend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Tauri Linux build dependencies
        run: |
          # The hosted image adds Chrome's repository, which is unrelated to these builds and can
          # transiently publish mismatched index/release hashes. Keep apt refresh scoped to the
          # Ubuntu repositories that provide the Tauri libraries below.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri -> target
      - name: npm ci
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Build frontend
        working-directory: apps/${{ matrix.app }}
        run: npm run build
      - name: svelte-check
        working-directory: apps/${{ matrix.app }}
        run: npm run check
      - name: cargo check
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo check --locked
      - name: cargo test
        # Partial, disclosed reversal of this job's original cargo-check-only
        # scope (P-001 WP-3, P-052): WP-5's exit bar is "fakes pass in CI",
        # meaningless if the fakes never run. creator-extend has real unit +
        # wiremock contract tests (P-054); stream-extend has OBS protocol
        # contract tests (P-055). Shared relay-client tests run separately
        # below because Cargo does not run dependency-crate tests implicitly.
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo test --locked
      - name: Shared relay client tests
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo test --locked -p relay-client
      - name: Shared module setup tests
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo test --locked -p tauri-plugin-module-setup
      - name: Shared readiness contract tests
        working-directory: .
        run: cargo test --locked --manifest-path apps/shared/setup-engine/Cargo.toml
      - name: Shared local settings tests
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo test --locked -p local-settings
