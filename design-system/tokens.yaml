      shared-ui:     {source: shared-recordings-ui, dark: {value: "#71d28d", raw: "color: #71d28d;"}, note: "status chips; messages use #a4d9b1"}
      extend-shell:  {source: extend-shell-ui, light: {value: "#2b5d44", raw: ".notice { color: #2b5d44; }"}}
  status.warning:
    description: Warnings and caution states.
    proposed: null
