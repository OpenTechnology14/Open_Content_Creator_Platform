      creator-extend: {source: creator-extend-ui, dark: {value: "#e39b43", raw: "color: #e39b43;"}, note: ".render-tools"}
      job-hunter:     {source: jobhunter-admin, dark: {value: "#fbbf24", raw: "--yellow: #fbbf24"}, note: "its orange is #fb923c"}
  product.stream-extend:
    description: Stream Extend's identity color (heading, outline buttons, app icon family).
    proposed: {dark: "#ff6b35"}
    observed:
      stream-extend: {source: stream-extend-ui, dark: {value: "#ff6b35", raw: "h2 { color: #ff6b35;"}}
  product.creator-extend:
    description: Creator Extend's identity color (heading, active tab, outline buttons).
    proposed: {dark: "#7c4dff"}
    observed:
      creator-extend: {source: creator-extend-ui, dark: {value: "#7c4dff", raw: "h2 { color: #7c4dff;"}}

# ───────────────────────────── type ─────────────────────────────
type:
  family.sans:
    description: The UI and body family.
    proposed: "'Space Grotesk', system-ui, sans-serif"
    blocked_by: D-3
    observed:
      blog:          {source: blog-css, value: "var(--font-space-grotesk), system-ui, sans-serif", raw: "--font-sans: var(--font-space-grotesk), system-ui, sans-serif"}
      blog-loading:  {source: blog-layout, value: "Space Grotesk via next/font/google, weights 400 500 600 700, latin", raw: 'weight: ["400", "500", "600", "700"],'}
      app:           {source: app-css, value: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',", raw: "font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',"}
      myfeed:        {source: myfeed-css, value: "'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif", raw: "'DM Sans',"}
      stream-extend: {source: stream-extend-ui, value: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif", raw: "font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"}
      extend-shell:  {source: extend-shell-ui, value: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", raw: "font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;"}
      overlays:      {source: overlay-lower-third, value: "'Inter', system-ui, sans-serif", raw: "font-family: 'Inter', system-ui, sans-serif;"}
  family.mono:
    description: Code and tabular text.
    proposed: "'JetBrains Mono', monospace"
    blocked_by: D-3
    observed:
      blog: {source: blog-css, value: "var(--font-jetbrains-mono), monospace", raw: "--font-mono: var(--font-jetbrains-mono), monospace", note: "JetBrains Mono, weights 400-700"}
  weight:
    proposed: {normal: 400, medium: 500, semibold: 600, bold: 700}
    basis: "Tailwind 4.2.1 defaults as installed in the Blog (read 2026-10-21, not a tracked file); the Blog loads exactly these four weights."
  size:
    description: Type scale in rem. Sizes are the Tailwind defaults the Blog inherits (it overrides none).
    proposed: {xs: 0.75rem, sm: 0.875rem, base: 1rem, lg: 1.125rem, xl: 1.25rem, 2xl: 1.5rem, 3xl: 1.875rem, 4xl: 2.25rem, 5xl: 3rem}
    basis: "tailwindcss 4.2.1 theme.css --text-xs..--text-5xl, read from the Blog's installed package on 2026-10-21. Line heights differ between Tailwind 3 and 4 and are not proposed here."
    observed:
      blog-prose:    {source: blog-css, value: {h2: "1.6rem / 1.3", h3: "1.25rem / 1.35", h4: "1.075rem / 1.4"}, raw: "font-size: 1.6rem;", note: "article headings override the scale"}
      app:           {source: app-css, value: "body 15px", raw: "font-size: 15px;"}
      extend-shell:  {source: extend-shell-ui, value: {h1: 34px, h2: 22px}, raw: "h1 { margin: 7px 0 30px; font-size: 34px;"}
      overlays:      {source: overlay-lower-third, value: {title: 28px, subtitle: 18px}, raw: ".title { font-weight: 700; font-size: 28px; }"}
      desktop-apps:  {source: stream-extend-ui, value: "ad hoc rem sizes from 0.72rem to 2rem; no scale", raw: "font-size: 0.9rem;"}

# ───────────────────────────── space ─────────────────────────────
space:
  unit:
    proposed: 0.25rem
    basis: "Tailwind 4.2.1 --spacing: 0.25rem (Blog, read 2026-10-21). All three shadcn/Tailwind consumers sit on this 4px grid."
  scale:
    description: Steps as multiples of the unit (step 4 = 1rem).
    proposed: [1, 2, 3, 4, 6, 8, 12, 16]
    basis: "A compact subset of Tailwind's steps. The desktop apps' dominant gaps (0.5rem, 1rem, 1.5rem) are steps 2, 4 and 6."
  observed_off_grid:
    description: Desktop-app gaps that are not multiples of the unit.
    values: {".7rem": 7, ".6rem": 7, ".4rem": 5, ".45rem": 4, "0.35rem": 3}
    source: apps/**/*.svelte
    raw: "gap: .7rem"

# ───────────────────────────── radius ─────────────────────────────
radius:
  base:
    proposed: 0.625rem
    basis: Blog --radius.
    observed:
      blog: {source: blog-css, value: 0.625rem, raw: "--radius: 0.625rem"}
      app:  {source: app-css, value: 0.75rem, raw: "--radius: 0.75rem"}
  derived:
    description: Both shadcn consumers derive the scale from the base.
    proposed: {lg: "base", md: "base - 2px", sm: "base - 4px"}
    observed:
      blog: {source: blog-css, raw: "--radius-md: calc(var(--radius) - 2px);"}
      app:  {source: app-tailwind, raw: 'md: "calc(var(--radius) - 2px)",'}
  observed_desktop:
    description: Border radii in the desktop apps, by declaration count.
    values: {8px: 18, 6px: 14, 12px: 11, 7px: 9, 10px: 6}
    source: apps/**/*.svelte
    raw: "border-radius: 8px"

# ───────────────────────────── shadow ─────────────────────────────
shadow:
  card:
    proposed: {light: "0 1px 3px 0 hsl(220 25% 10% / 0.06), 0 1px 2px -1px hsl(220 25% 10% / 0.06)", dark: "0 1px 3px 0 hsl(0 0% 0% / 0.2)"}
    observed:
      blog: {source: blog-css, light: {raw: "--shadow-card: 0 1px 3px 0 hsl(220 25% 10% / 0.06), 0 1px 2px -1px hsl(220 25% 10% / 0.06);"}, dark: {raw: "--shadow-card: 0 1px 3px 0 hsl(0 0% 0% / 0.2);"}}
  card-hover:
    proposed: {light: "0 10px 30px -8px hsl(215 90% 52% / 0.15)", dark: "0 10px 30px -8px hsl(215 90% 58% / 0.25)"}
    observed:
      blog: {source: blog-css, light: {raw: "--shadow-card-hover: 0 10px 30px -8px hsl(215 90% 52% / 0.15);"}, dark: {raw: "--shadow-card-hover: 0 10px 30px -8px hsl(215 90% 58% / 0.25);"}}
  observed_other:
    app:    {source: app-tailwind, value: "apple, apple-md, apple-lg (rgba black, 3 elevations)", raw: 'apple: "0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05)",'}
    myfeed: {source: myfeed-css, value: "0 4px 16px #29374b05", raw: "--shadow: 0 4px 16px #29374b05"}
    desktop-apps: "none: the Stream Extend, Creator Extend and Extend shell pages declare no box-shadow; they separate surfaces with borders"

# ───────────────────────────── motion ─────────────────────────────
motion:
  duration:
    description: Transition and animation durations.
    proposed: {fast: 150ms, base: 200ms, slow: 400ms}
    basis: >-
      150ms is Tailwind's default transition duration (Blog, read 2026-10-21) and MyFeed's `transform 0.15s`;
      200ms is the Blog's accordion and the desktop apps' `0.2s` transitions; 400ms is the Blog's fade-in.
    observed:
      blog:          {source: blog-css, value: {accordion: 0.2s, fade-in: 0.4s}, raw: "--animate-fade-in: fade-in 0.4s ease-out forwards;"}
      stream-extend: {source: stream-extend-ui, value: "all 0.2s", raw: "0.2s"}
      myfeed:        {source: myfeed-css, value: "transform 0.15s", raw: "transition: transform 0.15s;"}
  easing:
    proposed: ease-out
    basis: The Blog's three animations all use ease-out.
  reduced_motion:
    rule: Honor prefers-reduced-motion everywhere.
    observed: "Verified in MyFeed only (a global animation/transition: none under the media query); absent in the Blog, the App and the three desktop pages."

# ───────────────────────────── brand marks ─────────────────────────────
# Verified from files in this repository. These are marks, not interface tokens.
brand_marks:
  hybrid-platform:
    file: docs/assets/logo.svg
    colors: {ground: "#1a1a2e", stroke: "#ff6b35", accent: "#7c4dff", line: "#e0e0e0"}
    raw: ['fill="#1a1a2e"', 'stroke="#ff6b35"', 'stroke="#7c4dff"', 'stroke="#e0e0e0"']
    note: Declared canonical in modules/social-management/catalog.yaml.
  opentechapp:
    file: modules/social-management/assets/brands/opentechapp.svg
    colors: {ground: "#0052cc", glyph: white}
    raw: ['fill="#0052cc"']
    note: A favicon copied from the owner workspace on 2026-09-10, per catalog.yaml.

# ───────────────────────────── contrast ─────────────────────────────
# Computed, never estimated: WCAG 2.x relative-luminance ratio. tests/design_system re-computes every number here.
# `min` is 4.5 for normal text, 3.0 for large text and for UI components and graphical objects.
contrast:
  pairs:
    - {id: text-on-base,        fg: text.primary,           bg: surface.base,    min: 4.5, use: body text}
    - {id: muted-on-base,       fg: text.muted,             bg: surface.base,    min: 4.5, use: helper text}
    - {id: muted-on-raised,     fg: text.muted,             bg: surface.raised,  min: 4.5, use: helper text on cards}
    - {id: muted-on-subtle,     fg: text.muted,             bg: surface.subtle,  min: 4.5, use: helper text on muted areas}
    - {id: primary-contrast,    fg: brand.primary-contrast, bg: brand.primary,   min: 4.5, use: primary button label}
    - {id: primary-as-text,     fg: brand.primary,          bg: surface.base,    min: 4.5, use: link text}
    - {id: accent-contrast,     fg: brand.accent-contrast,  bg: brand.accent,    min: 4.5, use: accent badge label}
    - {id: accent-as-graphic,   fg: brand.accent,           bg: surface.base,    min: 3.0, use: accent icon or border}
    - {id: danger-contrast,     fg: status.danger-contrast, bg: status.danger,   min: 4.5, use: destructive button label}
    - {id: focus-ring,          fg: focus.ring,             bg: surface.base,    min: 3.0, use: focus indicator}
    - {id: input-boundary,      fg: border.input,           bg: surface.base,    min: 3.0, use: control boundary}
  known_failures:
    - {pair: muted-on-subtle,  theme: light, ratio: 4.24, decision: D-5}
    - {pair: muted-on-subtle,  theme: dark,  ratio: 4.30, decision: D-5}
    - {pair: primary-contrast, theme: light, ratio: 4.43, decision: D-5}
    - {pair: primary-contrast, theme: dark,  ratio: 3.66, decision: D-5}
    - {pair: primary-as-text,  theme: light, ratio: 4.12, decision: D-5}
    - {pair: accent-contrast,  theme: light, ratio: 2.57, decision: D-5}
    - {pair: accent-contrast,  theme: dark,  ratio: 1.97, decision: D-5}
    - {pair: accent-as-graphic, theme: light, ratio: 2.40, decision: D-5}
    - {pair: danger-contrast,  theme: light, ratio: 3.78, decision: D-5}
    - {pair: input-boundary,   theme: light, ratio: 1.25, decision: D-5}
    - {pair: input-boundary,   theme: dark,  ratio: 1.31, decision: D-5}
  observed_pairs:
    - {id: app-primary-contrast-light, fg: "hsl(0 0% 100%)", bg: "hsl(211 100% 50%)", min: 4.5, ratio: 3.97, where: OpenTechnologyApp primary button, light}
    - {id: app-primary-contrast-dark,  fg: "hsl(0 0% 100%)", bg: "hsl(211 100% 60%)", min: 4.5, ratio: 3.03, where: OpenTechnologyApp primary button, dark}
    - {id: stream-hover-fill,          fg: "#ffffff", bg: "#ff6b35", min: 4.5, ratio: 2.84, where: Stream Extend outline button on hover}
    - {id: creator-accent-text,        fg: "#7c4dff", bg: "#1a1a1a", min: 4.5, ratio: 3.62, where: Creator Extend heading and button text on a panel}
    - {id: shell-focus,                fg: "#c69045", bg: "#f6f5f1", min: 3.0, ratio: 2.57, where: Extend shell focus outline}
